# Per-market settings read by the pipeline bot (tools/pipeline) and the Bland call module.
# Prices marked "validate" are starting points to test in the pilot.

version: 3

defaults:
  max_call_attempts_per_lead: 3   # first call + 2 follow-ups
  min_hours_between_calls: 48
  projection_months: 3
  disclose_ai_in_opener: false
  kill_switch:
    call_answer_rate_min: 0.05    # below this, numbers are likely flagged as spam: rotate numbers

markets:
  US:
    language: en
    bland_language: en
    timezone: America/Chicago     # per-lead time zone from the listing overrides this
    phone_country_code: "1"
    currency: USD
    price: { keep: 99, grow: 179, setup: 149 }
    price_label: { keep: $99, grow: $179, setup: $149 }
    call_days: [tue, wed, thu]
    calling_window_local: [["09:00", "18:00"]]
    # AI-voice calls to US mobile numbers need the called owner's own prior consent (TCPA);
    # business landlines don't. Line type comes from Twilio Lookup (tools/pipeline/src/linetype.js).
    call_line_types: [landline]
    ask_maps_live: true

  MY:
    language: en                  # per target: en, ms or zh
    bland_language: en
    timezone: Asia/Kuala_Lumpur
    phone_country_code: "60"
    currency: MYR
    price: { keep: 199, grow: 399, premium: 699, setup: 390 }   # validate; setup waived
    price_label: { keep: RM199, grow: RM399, setup: RM390 }
    call_days: [mon, tue, wed, thu, fri]
    calling_window_local: [["10:00", "11:30"], ["15:00", "17:30"]]   # between the breakfast/lunch and dinner rushes
    blocked:
      fri: [["12:00", "15:00"]]   # Friday prayers
    state_call_days:              # states with a Friday-Saturday weekend
      Kedah: [sun, mon, tue, wed, thu]
      Kelantan: [sun, mon, tue, wed, thu]
      Terengganu: [sun, mon, tue, wed, thu]
    call_line_types: [landline, mobile, unknown]
    ask_maps_live: true           # Ask Maps rolled out in Malaysia Aug 2026 (English)

  FR:
    language: fr
    bland_language: fr
    timezone: Europe/Paris
    phone_country_code: "33"
    currency: EUR
    price: { keep: 69, grow: 129, setup: 99 }
    price_label: { keep: 69 €, grow: 129 €, setup: 99 € }
    call_days: [tue, wed, thu]
    calling_window_local: [["10:00", "12:00"], ["14:30", "18:00"]]
    call_line_types: [landline, mobile, unknown]
    ask_maps_live: false
